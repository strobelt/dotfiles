;--------------------------------------------
; colors                                    ;
;--------------------------------------------

[colors]
	modules_bg = ${xrdb:background}
	modules_fg = ${xrdb:foreground}

;--------------------------------------------
; bars                                      ;
;--------------------------------------------

[bar/space]
	dpi      = 192
	width    = 100%
	height   = 2.4%:+10
	foreground = #00000000
	background = #00000000
  modules-left = space
	bottom = false
	fixed-center = true
	monitor = ${env:MONITOR:}

[bar/base]
	dpi      = 192
	width    = 100%:-40
	height   = 2.4%
	offset-x = 20
	offset-y = 20
  radius   = 0
	bottom = false
  override-redirect = true
	foreground = ${xrdb:foreground}
  background = ${xrdb:background}
	spacing            = 0
	module-margin-left = 0
  modules-left   = arch xwindow
  modules-center = workspaces
	modules-right  = tray volume network ram cpu time powermenu
	fixed-center = true
	monitor = ${env:MONITOR:}

  font-0 = CaskaydiaMonoNerdFont-Regular:size=4.5;1
  font-1 = CaskaydiaMonoNerdFont-Regular:size=10;5
  font-2 = CaskaydiaMonoNerdFont-Regular:size=6;3

[module/workspaces]
	type              = internal/i3
	format            = <label-state><label-mode>
	index-sort        = true
	wrapping-scroll   = false
	strip-wsnumbers   = true

	label-focused   = 󰄯
	label-visible   =   
	label-unfocused =   

  label-focused-padding-right   = 1
  label-visible-padding-right   = 1
  label-unfocused-padding-right = 1

  label-separator      = " "

#  label-focused-font   = 2
#  label-visible-font   = 2
#  label-unfocused-font = 2

	pin-workspaces = false

[module/space]
	type          = custom/text
	format        = <label>
	label         = " "

[module/xwindow]
	type                     = internal/xwindow
	format                   = "<label>"
  format-suffix            = ""
  format-suffix-font       = 2
  format-suffix-foreground = ${xrdb:color41}
	label                    = %title:0:10:...%
	label-padding-left       = 2
	label-padding-right      = 1
  label-background         = ${xrdb:color41}
  label-foreground         = ${xrdb:foreground}

[module/arch]
	type                     = custom/text
	format                   = <label>
	label                    = "󰣇 "
  label-font               = 3
  label-padding-left       = 2
  label-padding-right      = 1
  format-suffix            = ""
  format-suffix-font       = 2
  format-suffix-foreground = ${xrdb:color40}
  format-suffix-background = ${xrdb:color41}
  label-background         = ${xrdb:color40}
  label-foreground         = ${xrdb:foreground}

[module/tray]
  type = internal/tray
  format-margin = 8px
  tray-spacing = 8px

[module/volume]
	type          = internal/pulseaudio
	format-volume = <ramp-volume><label-volume>
	mapped = true
	label-volume            = "%percentage%%"
	label-volume-padding    = 1
  ramp-volume-0 = " "
  ramp-volume-1 = " "
  ramp-volume-2 = " "
	format-muted = <label-muted>
  click-right = pavucontrol
	label-muted            = "  %percentage%% (muted)"
	label-muted-padding    = 1

	label-volume-background   = ${xrdb:color45}
	label-volume-foreground   = ${xrdb:foreground}
  label-volume-padding-right = 1
  format-volume-prefix    = ""
  format-volume-prefix-font = 2
  format-volume-prefix-foreground = ${xrdb:color45}
	label-muted-background   = ${xrdb:color45}
	label-muted-foreground   = ${xrdb:foreground}
  label-muted-padding-right = 1
  format-muted-prefix    = ""
  format-muted-prefix-font = 2
  format-muted-prefix-foreground = ${xrdb:color45}
  ramp-volume-foreground = ${xrdb:foreground}
  ramp-volume-background = ${xrdb:color45}
  ramp-volume-padding-left = 1


[module/network]
	type          = internal/network
	interface     = wlan0
	ping-interval = 3
  format-connected = <ramp-signal><label-connected>
  format-disconnected = <label-disconnected>
  label-connected = "%downspeed%"
  ramp-signal-0 = "󰤯 "
  ramp-signal-1 = "󰤟 "
  ramp-signal-2 = "󰤢 "
  ramp-signal-3 = "󰤢 "
  ramp-signal-4 = "󰤨 "
  ramp-signal-5 = "󰤨 "
	label-connected-background   = ${xrdb:color44}
	label-connected-foreground   = ${xrdb:foreground}
  label-connected-padding-right = 1
  format-connected-prefix    = ""
  format-connected-prefix-font = 2
  format-connected-prefix-foreground = ${xrdb:color44}
  format-connected-prefix-background = ${xrdb:color45}
	label-disconnected-background   = ${xrdb:color44}
	label-disconnected-foreground   = ${xrdb:foreground}
  label-disconnected-padding-right = 1
  format-disconnected-prefix    = ""
  format-disconnected-prefix-font = 2
  format-disconnected-prefix-foreground = ${xrdb:color44}
  format-disconnected-prefix-background = ${xrdb:color45}
  ramp-signal-foreground = ${xrdb:foreground}
  ramp-signal-background = ${xrdb:color44}
  ramp-signal-padding = 1

[module/ram]
	type     = internal/memory
	interval = 3
	format             = <label> 
	label              = " %percentage_used:3%%"
	label-background   = ${xrdb:color43}
	label-foreground   = ${xrdb:foreground}
  label-padding      = 1
  format-prefix      = ""
  format-prefix-font = 2
  format-prefix-foreground = ${xrdb:color43}
  format-prefix-background = ${xrdb:color44}

[module/cpu]
	type               = internal/cpu
	interval           = 0.5
	format             = <label> 
	label              = " %percentage:3%%"
	label-background   = ${xrdb:color42}
	label-foreground   = ${xrdb:foreground}
  label-padding      = 1
  format-prefix      = ""
  format-prefix-font = 2
  format-prefix-foreground = ${xrdb:color42}
  format-prefix-background = ${xrdb:color43}

[module/time]
	type                     = internal/date
	interval                 = 1.0
	time                     = "  %H:%M "
	label                    = "%time%"
	format                   = <label>
  format-prefix            = ""
  format-prefix-font       = 2
  format-prefix-foreground = ${xrdb:color41}
  format-prefix-background = ${xrdb:color42}
	label-background         = ${xrdb:color41}
	label-foreground         = ${xrdb:foreground}
	label-padding-left       = 1
	label-padding-right      = 0

[module/powermenu]
	type            = custom/menu
  label-open      = "⏻  "
  label-close     = "󰅚  "
  label-separator = " | "

  expand-right    = false
  menu-0-0        = Shutdown
  menu-0-0-exec   = #powermenu.open.1
  menu-1-0        = Yes
  menu-1-0-exec   = poweroff
  menu-1-1        = No

  format-prefix    = ""
  format-prefix-font = 2
  format-prefix-background = ${xrdb:color41}
  format-prefix-foreground = ${xrdb:color40}
  label-open-background = ${xrdb:color40}
  label-close-background = ${xrdb:color40}
  label-separator-background = ${xrdb:color40}
  menu-0-0-background = ${xrdb:color40}
  menu-1-0-background = ${xrdb:color40}
  menu-1-1-background = ${xrdb:color40}

[module/date]
	type           = internal/date
	interval       = 1.0
	date           = "%Y-%m-%d"
	label          = " %date%"
	format         = <label>
	format-padding = 0
	label-background = ${xrdb:background}
	label-foreground = ${xrdb:foreground}
