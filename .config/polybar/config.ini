;--------------------------------------------
; colors                                    ;
;--------------------------------------------

[colors]
	modules_bg = ${xrdb:background}
	modules_fg = ${xrdb:foreground}

;--------------------------------------------
; bars                                      ;
;--------------------------------------------

[bar/base]
	dpi      = 192
	width    = 100%
	height   = 32
	offset-x = 0
	offset-y = 0

	bottom = false

	foreground = ${xrdb:foreground}
	background = ${xrdb:background}

	spacing            = 0
	padding-left       = 0
	padding-right      = 0
	module-margin-left = 0

  font-0 = CaskaydiaMonoNerdFont-Regular:size=4.5;1

  modules-left   = workspaces
  modules-center = time xwindow
	modules-right  = volume network ram cpu date powermenu

	fixed-center = true

	monitor = ${env:MONITOR:}

[module/workspaces]
	type            = internal/i3
	format          = <label-state><label-mode>
	index-sort      = true
	wrapping-scroll = false
	strip-wsnumbers = true
  label-active-font = 2

	label-mode-background    = ${xrdb:background}
	label-mode-foreground    = ${xrdb:foreground}
	label-mode-padding       = 1
	label-mode-padding-left  = 2
	label-mode-padding-right = 2

	label-focused               = %name%
	label-focused-background    = ${xrdb:color8}
  label-focused-foreground    = ${xrdb:color4}
	label-focused-padding       = 1
	label-focused-padding-left  = 2
	label-focused-padding-right = 2

	label-unfocused               = %name%
	label-unfocused-background    = ${xrdb:background}
	label-unfocused-foreground    = ${xrdb:foreground}
	label-unfocused-padding       = 1
	label-unfocused-padding-left  = 2
	label-unfocused-padding-right = 2

	label-visible               = %name%
	label-visible-background    = ${xrdb:background}
	label-visible-foreground    = ${xrdb:foreground}
	label-visible-padding       = 1
	label-visible-padding-left  = 2
	label-visible-padding-right = 2

	label-urgent               = •
	label-urgent-background    = ${xrdb:background}
	label-urgent-foreground    = ${xrdb:foreground}
	label-urgent-padding       = 1
	label-urgent-padding-left  = 2
	label-urgent-padding-right = 2

	pin-workspaces = true

[module/time]
	type           = internal/date
	interval       = 1.0
	time           = "  %H:%M"
	label          = "%time%"
	format         = <label>
	format-padding = 0
	label-background = ${xrdb:background}
	label-foreground = ${xrdb:foreground}
	label-padding    = 0

[module/xwindow]
	y-offset      = 10
	type          = internal/xwindow
	format        = <label>
	label         = %title:0:50:%
	label-padding = 2

[module/volume]
	type          = internal/pulseaudio
	format-volume = <ramp-volume> <label-volume>
	mapped = true
	label-volume            = "%percentage%%"
	label-volume-background = ${xrdb:background}
	label-volume-foreground = ${xrdb:foreground}
	label-volume-padding    = 1
  ramp-volume-0 = 
  ramp-volume-1 = 
  ramp-volume-2 = 
	format-muted = <label-muted>
  click-right = pavucontrol
	label-muted            = "  %percentage%% (muted)"
	label-muted-background = ${xrdb:background}
	label-muted-foreground = ${xrdb:foregroung}
	label-muted-padding    = 1

[module/network]
	type          = internal/network
	interface     = wlan0
	ping-interval = 3
  format-connected = <ramp-signal> <label-connected>
  format-disconnected = <label-disconnected>
  label-connected = "%downspeed%"
  ramp-signal-0 = 󰤯
  ramp-signal-1 = 󰤟
  ramp-signal-2 = 󰤢
  ramp-signal-3 = 󰤢
  ramp-signal-4 = 󰤨
  ramp-signal-5 = 󰤨

[module/ram]
	type     = internal/memory
	interval = 3
	format             = <label> 
	label              = " %percentage_used:3%%"
	label-background   = ${colors.modules_bg}
	label-foreground   = ${colors.modules_fg}
  label-margin = 1

[module/cpu]
	type               = internal/cpu
	interval           = 0.5
	format             = <label> 
	label              = " %percentage:3%%"
	label-background   = ${colors.modules_bg}
	label-foreground   = ${colors.modules_fg}
  label-margin-right = 1

[module/date]
	type           = internal/date
	interval       = 1.0
	date           = "%Y-%m-%d"
	label          = " %date%"
	format         = <label>
	format-padding = 0
	label-background = ${xrdb:background}
	label-foreground = ${xrdb:foreground}

[module/powermenu]
	type            = custom/menu
  label-open      = "⏻ "
  label-close     = "󰅚 "
  label-separator = " | "
  format-margin   = 1
  expand-right    = false
  menu-0-0        = Shutdown
  menu-0-0-exec   = #powermenu.open.1
  menu-1-0        = Yes
  menu-1-0-exec   = poweroff
  menu-1-1        = No

